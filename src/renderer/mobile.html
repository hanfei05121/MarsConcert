<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>火星点歌台</title>
    <script>
      // rem 适配：以 375px 设计宽为基准（1rem=16px），按视口宽度等比缩放根字号。
      // 设上限 MAX 根字号（最多放大 2 倍），避免横屏/大屏平板比例失控。
      (function () {
        var BASE_W = 375
        var BASE = 16
        var MAX = 32
        function fit() {
          var w = document.documentElement.clientWidth
          var s = (BASE * w) / BASE_W
          document.documentElement.style.fontSize = Math.min(Math.max(s, BASE), MAX) + 'px'
        }
        fit()
        window.addEventListener('resize', fit)
        window.addEventListener('orientationchange', fit)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/mobile/main.ts"></script>
  </body>
</html>
